<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" fill="none">
  <defs>
    <!-- Filter for the 3D sticker bubble extrusion border -->
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#556B2F" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="12" stdDeviation="5" flood-color="#2D3B18" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#sticker-shadow)">
    <!-- Deep Olive Green Extrusion Shadow Layer (Offset +4px y) -->
    <text 
      x="50%" 
      y="118" 
      text-anchor="middle"
      fill="#526E2D"
      stroke="#526E2D"
      stroke-width="26"
      stroke-linejoin="round"
      stroke-linecap="round"
      font-family="'Fredoka', 'Outfit', 'Arial Rounded MT Bold', sans-serif" 
      font-weight="900" 
      font-size="78" 
      letter-spacing="2px">
      JAKARTA FOR ALL
    </text>

    <!-- Olive Green Outer Outline / Bubble Border -->
    <text 
      x="50%" 
      y="114" 
      text-anchor="middle"
      fill="#7B9339"
      stroke="#7B9339"
      stroke-width="24"
      stroke-linejoin="round"
      stroke-linecap="round"
      font-family="'Fredoka', 'Outfit', 'Arial Rounded MT Bold', sans-serif" 
      font-weight="900" 
      font-size="78" 
      letter-spacing="2px">
      JAKARTA FOR ALL
    </text>

    <!-- Clean Crisp White Core Letters -->
    <text 
      x="50%" 
      y="114" 
      text-anchor="middle"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="4"
      stroke-linejoin="round"
      stroke-linecap="round"
      font-family="'Fredoka', 'Outfit', 'Arial Rounded MT Bold', sans-serif" 
      font-weight="900" 
      font-size="78" 
      letter-spacing="2px">
      JAKARTA FOR ALL
    </text>
  </g>
</svg>
